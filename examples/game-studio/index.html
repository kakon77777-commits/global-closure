  <title>Key &amp; Door — A tiny quest</title>
  <style>
    :root { color-scheme: light; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: #203c39; background: #e6ecdd; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(ellipse at 20% 0%, #f6f8ed, transparent 60%), #e6ecdd; }
    main { width: min(100%, 540px); padding: 30px; background: #fcfcf5; border: 1px solid #cbd6c3; border-radius: 24px; box-shadow: 0 18px 60px #203c3914; }
    .eyebrow { margin: 0 0 8px; text-transform: uppercase; letter-spacing: .15em; font-size: .7rem; font-weight: 800; color: #547065; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 2.8rem); letter-spacing: -.055em; line-height: 1.1; }
    .intro { margin: 12px 0 24px; color: #536960; line-height: 1.5; }
    .status-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; font-size: .8rem; }
    .inventory { background: #f8e6b4; border: 1px solid #e4ce97; border-radius: 100px; padding: 7px 12px; font-weight: 750; }
    .moves { font-variant-numeric: tabular-nums; color: #536960; }
    .board-frame { border: 7px solid #405c50; border-radius: 13px; overflow: hidden; background: #e8edd5; box-shadow: 0 4px 0 #203c39; }
    .board { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); aspect-ratio: 5 / 5; }
    .tile { position: relative; aspect-ratio: 1; }
    .tile img, .entity { position: absolute; display: block; width: 100%; height: 100%; user-select: none; pointer-events: none; }
    .entity { width: calc(100% / 5); height: calc(100% / 5); }
    [hidden] { display: none !important; }
    .board[data-state="unlocked"] #exit { filter: drop-shadow(0 0 4px #f6c760); }
    .board[data-state="won"] { box-shadow: inset 0 0 0 4px #f6c760; }
    .progress { margin-top: 24px; }
    #objective { margin: 0; font-size: 1rem; line-height: 1.45; font-weight: 800; }
    #feedback { min-height: 2.8em; margin: 6px 0 20px; color: #536960; font-size: .85rem; line-height: 1.4; }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; border-top: 1px solid #dde3d5; padding-top: 20px; }
    .controls { margin: 0; font-size: .78rem; line-height: 1.75; color: #536960; }
    kbd { font: inherit; color: #203c39; font-weight: 750; }
    button { flex-shrink: 0; border: 1px solid #203c39; border-radius: 10px; background: #203c39; color: #fcfcf5; padding: 11px 17px; font: inherit; font-size: .84rem; font-weight: 750; cursor: pointer; }
    button:hover { background: #356157; }
    button:focus-visible { outline: 3px solid #b87947; outline-offset: 3px; }
    noscript { display: block; padding: 12px; background: #f8e6b4; margin: 16px 0; }
    @media (max-width: 440px) { main { padding: 22px 18px; } footer { gap: 12px; } }
  </style>
</head>

    <div class="progress" aria-live="polite" aria-atomic="true">
      <p id="objective">Find the brass key, then enter the door.</p>
      <p id="feedback">A little room, a little adventure.</p>
    </div>
    <noscript>This game needs JavaScript enabled in your browser.</noscript>
    <footer>
      <p class="controls" id="controls"><kbd>Arrow keys</kbd> or <kbd>W A S D</kbd> to move<br>One press, one step · <kbd>R</kbd> to restart</p>
      <button type="button" id="restart">Restart</button>
    </footer>
  </main>
  <script id="level-data" type="application/json">{"width":5,"height":5,"walls":[[1,1],[2,1],[3,1],[3,2],[0,3],[1,3],[3,3]],"player":[0,0],"exit":[4,0],"key":[0,4]}</script>
  <script id="game-runtime">(() => {
  'use strict';
  const level = JSON.parse(document.getElementById('level-data').textContent);
  const ui = Object.fromEntries(['board', 'player', 'key', 'inventory', 'objective',
    'feedback', 'moves', 'restart'].map(id => [id, document.getElementById(id)]));
  const walls = new Set(level.walls.map(cell => cell.join(',')));
  const vectors = {up:[0,-1], down:[0,1], left:[-1,0], right:[1,0]};
  const inputs = {arrowup:'up', w:'up', arrowdown:'down', s:'down',
    arrowleft:'left', a:'left', arrowright:'right', d:'right'};
  const same = (a, b) => a[0] === b[0] && a[1] === b[1];
  let state;

  function render() {
    ui.player.style.left = `${state.position[0] / level.width * 100}%`;
    ui.player.style.top = `${state.position[1] / level.height * 100}%`;
    ui.key.hidden = state.hasKey;
    ui.inventory.textContent = state.hasKey ? 'Key: collected' : 'Key: not found';
    ui.moves.textContent = `${state.moves} ${state.moves === 1 ? 'move' : 'moves'}`;
    ui.objective.textContent = state.won ? 'You made it out!' : state.hasKey
      ? 'The door is ready. Head for the exit.' : 'Find the brass key, then enter the door.';
    ui.board.dataset.state = state.won ? 'won' : state.hasKey ? 'unlocked' : 'locked';
    ui.board.setAttribute('aria-label', `${level.width} by ${level.height} room. ` +
      `Player at column ${state.position[0] + 1}, row ${state.position[1] + 1}. ` +
      `${state.hasKey ? 'Key collected.' : 'Key not collected.'} ${state.won ? 'You won.' : ''}`);
    const feedback = {
      ready:'A little room, a little adventure.',
      moved:state.hasKey ? 'Carry the key to the arched door.' : 'Explore the open stone tiles.',
      blocked_bounds:'The edge of the room stops you.',
      blocked_wall:'A stone wall blocks the way.',
      blocked_exit:'The door is locked. Find the brass key.',
      key_collected:'Key collected! The door is now unlocked.',
      won:`Room cleared in ${state.moves} moves. Play again whenever you like.`
    };
    ui.feedback.textContent = feedback[state.event];
  }

  function restart() {
    state = {position:[...level.player], hasKey:false, won:false, moves:0, event:'ready'};
    render();
  }

  function move(direction) {
    if (state.won) return;
    const [dx, dy] = vectors[direction];
    const next = [state.position[0] + dx, state.position[1] + dy];
    if (next[0] < 0 || next[0] >= level.width || next[1] < 0 || next[1] >= level.height) {
      state.event = 'blocked_bounds';
    } else if (walls.has(next.join(','))) {
      state.event = 'blocked_wall';
    } else if (same(next, level.exit) && !state.hasKey) {
      state.event = 'blocked_exit';
    } else {
      state.position = next;
      state.moves += 1;
      state.event = 'moved';
      if (same(next, level.key) && !state.hasKey) {
        state.hasKey = true;
        state.event = 'key_collected';
      }
      if (same(next, level.exit) && state.hasKey) {
        state.won = true;
        state.event = 'won';
      }
    }
    render();
  }

  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey) return;
    if (['INPUT','TEXTAREA','SELECT'].includes(event.target?.tagName) || event.target?.isContentEditable) return;
    const key = event.key.toLowerCase();
    const direction = inputs[key];
    if (!direction && key !== 'r') return;
    event.preventDefault();
    if (event.repeat) return;
    if (key === 'r') restart();
    else move(direction);
  });
  ui.restart.addEventListener('click', restart);
  // A read-only snapshot supports bounded diagnostics without changing gameplay.
  window.keyDoor = Object.freeze({snapshot:() => ({...state, position:[...state.position]})});
  restart();
})();
</script>
